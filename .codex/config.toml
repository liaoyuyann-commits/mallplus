[project]
name = "MallPlus"
working_dir = "."

[agent]
read_first = [
  "AGENTS.md",
  "MEMORY.md",
  "agent_docs/project_brief.md",
  "agent_docs/tech_stack.md",
  "agent_docs/testing.md"
]

[behavior]
plan_first = true
incremental_changes = true
verify_after_change = true

[constraints]
no_delete_without_confirmation = true
no_schema_changes_without_approval = true
no_framework_rewrites = true
no_unapproved_feature_additions = true
