# MallPlus 本地联调用单节点 broker 配置
# brokerIP1 设为 127.0.0.1：宿主机应用通过端口映射(10911)回连 broker，
# 避免 Docker 内网 IP 无法被宿主机访问的问题。
brokerIP1=127.0.0.1
brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0
deleteWhen=04
fileReservedTime=48
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
# 本地联调自动创建 topic，避免手动创建；生产环境应关闭
autoCreateTopicEnable=true
autoCreateSubscriptionGroup=true
